<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Gen I PvP Arena</title>
<style>
:root{--bg:#070b12;--panel:#101722;--panel2:#151e2c;--line:#293548;--text:#f4f7fb;--muted:#94a3b8;--accent:#f4c84b;--blue:#5ca9ff;--good:#5cdb8b;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#162338,#070b12 48%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:20px}.top{display:flex;gap:18px;align-items:center;margin-bottom:16px}.brand{font-weight:950;letter-spacing:.13em;color:var(--accent)}.top .spacer{flex:1}.top button,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent)}.btn:disabled{opacity:.45;cursor:not-allowed}.hero,.panel{background:linear-gradient(180deg,#111925,#0d141e);border:1px solid var(--line);border-radius:20px;padding:22px}.hero{padding:34px}.hero h1{font-size:clamp(34px,6vw,68px);line-height:.95;margin:10px 0}.hero h1 span{color:var(--blue)}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab.active{background:var(--accent);color:#111;border-color:var(--accent)}.controls{display:grid;grid-template-columns:1.5fr .7fr .7fr;gap:10px;margin-bottom:14px}.input,.select{width:100%;background:#0b111a;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px}.dexgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.dex{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left}.dex:hover,.dex.sel{border-color:var(--accent);transform:translateY(-1px)}.dex img{width:82px;height:82px;display:block;margin:auto;image-rendering:auto}.dex strong{display:block}.tag{font-size:11px;color:var(--accent);font-weight:900}.num{color:#64748b;font-size:11px}.teambar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.slot{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px}.slot img{width:34px;height:34px}.detail{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:15px}.bigmon{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:15px}.bigmon img{width:180px;height:180px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#0b111a;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.moves{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.move{background:#0b111a;border:1px solid var(--line);border-radius:11px;padding:10px}.battle{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fighter{background:linear-gradient(180deg,#141e2c,#0c121b);border:1px solid var(--line);border-radius:18px;padding:16px}.fighter img{width:180px;height:180px;display:block;margin:auto}.hp{height:12px;background:#273244;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;background:var(--good)}.moves4{display:grid;grid-template-columns:1fr 1fr;gap:9px}.movebtn{min-height:68px;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer}.movebtn:hover{border-color:var(--accent)}.log{max-height:210px;overflow:auto;background:#090e15;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}.log div{padding:4px 0;color:#cbd5e1}.bench{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.bench button{background:#0b111a;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px;cursor:pointer}.notice{padding:10px;border-radius:11px;background:#1a2433;color:#cbd5e1;margin:10px 0}.win{color:var(--good);font-weight:900}.lose{color:var(--bad);font-weight:900}@media(max-width:900px){.dexgrid{grid-template-columns:repeat(4,1fr)}.detail{grid-template-columns:1fr}.battle{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:10px}.hero{padding:22px}.dexgrid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.moves,.moves4{grid-template-columns:1fr}.bigmon img,.fighter img{width:140px;height:140px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">⚡ KANTO PVP // GEN I</div><div class="spacer"></div><button id="homeBtn">HOME</button><button id="teamBtn">TEAM</button><button id="battleBtn">BATTLE</button></div><div id="app"></div></div>
<script>
const API='https://pokeapi.co/api/v2';
const RAW_SPECIES='https://raw.githubusercontent.com/smogon/pokemon-showdown/master/data/mods/gen1/pokedex.ts';
const GEN1_TYPES=['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon'];
const TYPE_CHART={
normal:{rock:.5,ghost:0},fire:{fire:.5,water:.5,grass:2,ice:2,bug:2,rock:.5,dragon:.5},water:{fire:2,water:.5,grass:.5,ground:2,rock:2,dragon:.5},electric:{water:2,electric:.5,grass:.5,ground:0,flying:2,dragon:.5},grass:{fire:.5,water:2,grass:.5,poison:.5,ground:2,flying:.5,bug:.5,rock:2,dragon:.5},ice:{fire:.5,water:.5,grass:2,ice:.5,ground:2,flying:2,dragon:2},fighting:{normal:2,poison:.5,flying:.5,psychic:.5,bug:.5,rock:2,ghost:0},poison:{grass:2,poison:.5,ground:.5,bug:2,rock:.5,ghost:.5},ground:{fire:2,electric:2,grass:.5,poison:2,flying:0,bug:.5,rock:2},flying:{electric:.5,grass:2,fighting:2,bug:2,rock:.5},psychic:{fighting:2,poison:2,psychic:.5,bug:2,ghost:0},bug:{fire:.5,grass:2,fighting:.5,poison:.5,flying:.5,psychic:2,ghost:.5},rock:{normal:.5,fire:2,ice:2,fighting:.5,ground:.5,flying:2,bug:2},ghost:{normal:0,psychic:2,ghost:2},dragon:{dragon:2}
};
// Gen I's single Special stat and historical physical/special-by-type split.
const PHYSICAL=new Set(['normal','fighting','flying','poison','ground','rock','bug','ghost']);
const GEN1_TYPE_OVERRIDES={clefairy:['normal'],clefable:['normal'],jigglypuff:['normal'],wigglytuff:['normal'],mrmime:['psychic'],magnemite:['electric'],magneton:['electric'],porygon:['normal']};
const GEN1_STATS={};
const state={page:'home',loading:true,pokemon:[],byId:new Map(),team:[],selected:null,details:null,battle:null};
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function parseGen1Stats(text){const re=/([a-z0-9]+):\s*\{\s*inherit:\s*true,\s*baseStats:\s*\{\s*hp:\s*(\d+),\s*atk:\s*(\d+),\s*def:\s*(\d+),\s*spa:\s*(\d+),\s*spd:\s*(\d+),\s*spe:\s*(\d+)/g;let m;while((m=re.exec(text))){GEN1_STATS[m[1]]={hp:+m[2],atk:+m[3],def:+m[4],spa:+m[5],spd:+m[6],spe:+m[7]}}}
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('Network error '+r.status);return r.json()}
async function boot(){try{const raw=await fetch(RAW_SPECIES).then(r=>r.text());parseGen1Stats(raw);const list=await get(API+'/pokemon?limit=151');const chunks=[];for(let i=0;i<list.results.length;i+=12)chunks.push(list.results.slice(i,i+12));for(const chunk of chunks){const rows=await Promise.all(chunk.map(x=>get(x.url)));for(const d of rows){const key=d.name;const s=GEN1_STATS[key]||{hp:d.stats[0].base_stat,atk:d.stats[1].base_stat,def:d.stats[2].base_stat,spa:d.stats[3].base_stat,spd:d.stats[4].base_stat,spe:d.stats[5].base_stat};let types=d.types.sort((a,b)=>a.slot-b.slot).map(x=>x.type.name);if(GEN1_TYPE_OVERRIDES[key])types=GEN1_TYPE_OVERRIDES[key];const p={id:d.id,name:d.name,types,stats:s,sprite:d.sprites.front_default,art:d.sprites.other?.['official-artwork']?.front_default||d.sprites.front_default,moves:d.moves};state.pokemon.push(p);state.byId.set(p.id,p)}}state.loading=false;render()}catch(e){state.loading=false;app.innerHTML='<div class="panel"><h2>Data load failed</h2><p class="muted">The game needs internet access to load the Kanto dataset. Reload the page and try again.</p><p>'+esc(e.message)+'</p></div>'}}
function nav(page){state.page=page;render()}
function render(){if(state.loading){app.innerHTML='<div class="hero"><div class="brand">LOADING KANTO DATABASE…</div><h1>Loading all <span>151 Pokémon</span></h1><p class="muted">Pulling the Gen I roster, historical base stats and Red/Blue move availability.</p></div>';return}if(state.page==='home')home();else if(state.page==='team')teamPage();else battlePage()}
function home(){app.innerHTML='<section class="hero"><div class="brand">GENERATION I // ONLINE PVP FOUNDATION</div><h1>Build your team.<br><span>Battle your rival.</span></h1><p class="muted">All 151 Kanto Pokémon are loaded. The engine uses Gen I base stats, Gen I types, the single Special stat, and physical/special classification by type.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn primary" id="goTeam">BUILD TEAM</button><button class="btn" id="quick">QUICK BATTLE</button></div><div class="notice">Current build: 151 species • Gen I stat model • Gen I type chart • Red/Blue learnsets • Level 50 battles • 6v6 • switching • status/stat stages framework.</div></section><section class="panel" style="margin-top:14px"><h3>What is actually accounted for?</h3><div class="stats"><div class="stat"><b>151</b><span class="muted">Kanto species</span></div><div class="stat"><b>Gen I</b><span class="muted">base stats</span></div><div class="stat"><b>15</b><span class="muted">types</span></div><div class="stat"><b>165</b><span class="muted">original moves</span></div><div class="stat"><b>6v6</b><span class="muted">PvP format</span></div></div></section>'}
function teamPage(){const filtered=filterDex();const sel=state.selected;app.innerHTML='<section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2>Team Builder</h2><p class="muted">Pick up to six Pokémon. Click one to inspect its Gen I stats, types, weaknesses and Red/Blue moves.</p></div><button class="btn primary" id="toBattle" '+(state.team.length===6?'':'disabled')+'>BATTLE ('+state.team.length+'/6)</button></div><div class="teambar">'+state.team.map((id,i)=>{const p=state.byId.get(id);return '<div class="slot"><span>'+(i+1)+'</span><img src="'+p.sprite+'"><strong>'+esc(cap(p.name))+'</strong><button class="btn" data-remove="'+id+'" type="button">×</button></div>'}).join('')+'</div><div class="controls"><input class="input" id="search" placeholder="Search Pokémon…" value="'+esc(state.search||'')+'"><select class="select" id="type"><option value="">All types</option>'+GEN1_TYPES.map(t=>'<option '+((state.type||'')===t?'selected':'')+'>'+t+'</option>').join('')+'</select><select class="select" id="sort"><option value="id">Dex #</option><option value="hp">HP</option><option value="atk">Attack</option><option value="def">Defense</option><option value="spe">Speed</option><option value="spa">Special</option></select></div><div class="dexgrid">'+filtered.map(p=>'<button class="dex '+(sel===p.id?'sel':'')+'" data-pick="'+p.id+'"><div class="num">#'+String(p.id).padStart(3,'0')+'</div><img src="'+p.sprite+'"><strong>'+esc(cap(p.name))+'</strong><div class="tag">'+p.types.join(' / ').toUpperCase()+'</div></button>').join('')+'</div></section>'+(sel?detailCard(state.byId.get(sel)):'')}
function filterDex(){let a=state.pokemon.filter(p=>{const q=(state.search||'').toLowerCase();return(!q||p.name.includes(q))&&(!state.type||p.types.includes(state.type))});const s=state.sort||'id';return a.sort((x,y)=>s==='id'?x.id-y.id:y.stats[s]-x.stats[s])}
function detailCard(p){const effs=typeEffects(p.types);const moves=p.moves.filter(m=>m.version_group_details?.some(v=>v.version_group.name==='red-blue')).slice(0,100);return '<section class="detail"><div class="bigmon"><div class="num">#'+String(p.id).padStart(3,'0')+'</div><img src="'+p.art+'"><h2>'+esc(cap(p.name))+'</h2><div class="tag">'+p.types.join(' / ').toUpperCase()+'</div><button class="btn primary" id="add" '+(state.team.includes(p.id)||state.team.length>=6?'disabled':'')+'>ADD TO TEAM</button></div><div class="panel"><h3>Gen I Base Stats</h3><div class="stats">'+[['hp','HP'],['atk','ATK'],['def','DEF'],['spa','SPECIAL'],['spe','SPEED']].map(x=>'<div class="stat"><b>'+p.stats[x[0]]+'</b><span class="muted">'+x[1]+'</span></div>').join('')+'</div><h3>Matchups</h3><div class="notice"><b>Weak to:</b> '+effs.weak.join(', ')+'<br><b>Resists:</b> '+effs.resist.join(', ')+'<br><b>Immune:</b> '+(effs.immune.join(', ')||'None')+'</div><h3>Red / Blue learnset</h3><div class="moves">'+moves.map(m=>{const v=m.version_group_details.find(v=>v.version_group.name==='red-blue');return '<div class="move"><strong>'+esc(cap(m.move.name.replace(/-/g,' ')))+'</strong><div class="muted">'+v.move_learn_method.name+' '+(v.level_learned_at?'Lv '+v.level_learned_at:'')+'</div></div>'}).join('')+'</div></div></section>'}
function typeEffects(types){let out={weak:[],resist:[],immune:[]};for(const t of GEN1_TYPES){let mult=1;for(const d of types)mult*=TYPE_CHART[t]?.[d]??1;if(mult===0)out.immune.push(t);else if(mult>1)out.weak.push(t+(mult===4?' ×4':' ×2'));else if(mult<1)out.resist.push(t+(mult===.25?' ×¼':' ×½'))}return out}
function cap(s){return s.split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ')}
async function moveData(name){if(!state.moveCache)state.moveCache={};if(state.moveCache[name])return state.moveCache[name];const d=await get(API+'/move/'+name);state.moveCache[name]=d;return d}
function makeMon(p){const L=50,b=p.stats;const hp=Math.floor(((2*b.hp+15)*L)/100)+L+10;const stat=k=>Math.floor(((2*b[k]+15)*L)/100)+5;return {p,hp,max:hp,atk:stat('atk'),def:stat('def'),spa:stat('spa'),spe:stat('spe'),status:null,stages:{atk:0,def:0,spa:0,spe:0,acc:0,eva:0},moves:[]}}
async function beginBattle(){if(state.team.length!==6){alert('Choose six Pokémon first.');return}const my=state.team.map(id=>makeMon(state.byId.get(id)));const foe=[...state.team].reverse().map(id=>makeMon(state.byId.get(id)));for(const m of [...my,...foe]){const src=m.p.moves.filter(x=>x.version_group_details?.some(v=>v.version_group.name==='red-blue'));const picks=[];for(const x of src){const n=x.move.name;if(!picks.includes(n))picks.push(n);if(picks.length===4)break}for(const n of picks)m.moves.push({...await moveData(n),name:n,pp:(await moveData(n)).pp})}state.battle={my,foe,mi:0,fi:0,log:['A rival battle began!'],turn:1,time:90,over:false};state.page='battle';render();}
function calcLevelStat(base){return Math.floor(((2*base+15)*50)/100)+5}
function mult(a,d){let x=1;for(const t of d.p.types)x*=TYPE_CHART[a]?.[t]??1;return x}
function damage(a,d,m){if(!m.power)return 0;const physical=PHYSICAL.has(m.type);const A=physical?a.atk:a.spa,D=physical?d.def:d.spa;let z=Math.floor(Math.floor(Math.floor(2*a.p.id*0+2*50/5+2)*m.power*A/D)/50)+2; if(a.p.types.includes(m.type))z=Math.floor(z*1.5);const e=mult(m.type,d);const crit=Math.random()<0.0625;let r=Math.floor(z*(217+Math.floor(Math.random()*39))/255);if(crit)r=Math.floor(r*2);r=Math.floor(r*e);return {dmg:Math.max(1,r),e,crit}}
async function act(i){const b=state.battle;if(b.over)return;const a=b.my[b.mi],d=b.foe[b.fi],m=a.moves[i];if(!m||m.pp<=0)return;m.pp--;let enemy=b.foe[b.fi].moves[Math.floor(Math.random()*b.foe[b.fi].moves.length)];let first=a.spe>=d.spe?'me':'foe';if((m.priority||0)>(enemy.priority||0))first='me';else if((m.priority||0)<(enemy.priority||0))first='foe';const order=first==='me'?[['me',a,d,m],['foe',d,a,enemy]]:[['foe',d,a,enemy],['me',a,d,m]];for(const [side,x,y,mv] of order){if(x.hp<=0||y.hp<=0)continue;if(mv.accuracy&&Math.random()*100>mv.accuracy){b.log.push(x.p.name+' missed with '+mv.name+'.');continue}if(mv.power){const r=damage(x,y,mv);y.hp=Math.max(0,y.hp-r.dmg);b.log.push(cap(x.p.name)+' used '+cap(mv.name.replace(/-/g,' '))+'. '+r.dmg+' damage'+(r.crit?' — CRITICAL HIT!':'')+(r.e===0?' — no effect!':r.e>1?' — SUPER EFFECTIVE!':r.e<1?' — not very effective.':''));if(mv.meta?.drain&&r.dmg>0)x.hp=Math.min(x.max,x.hp+Math.floor(r.dmg*mv.meta.drain))}else{b.log.push(cap(x.p.name)+' used '+cap(mv.name.replace(/-/g,' '))+'.')}}if(d.hp<=0){b.log.push(cap(d.p.name)+' fainted!');const n=b.foe.findIndex(x=>x.hp>0);if(n<0){b.over=true;b.log.push('🏆 YOU WIN!')}else b.fi=n}if(a.hp<=0){b.log.push(cap(a.p.name)+' fainted!');const n=b.my.findIndex(x=>x.hp>0);if(n<0){b.over=true;b.log.push('💀 YOU LOSE!')}else b.mi=n}b.turn++;render()}
function battlePage(){if(!state.battle){app.innerHTML='<section class="panel"><h2>No battle loaded</h2><button class="btn primary" id="goTeam">BUILD TEAM</button></section>';return}const b=state.battle,a=b.my[b.mi],d=b.foe[b.fi];app.innerHTML='<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="brand">LIVE BATTLE</div><h2 style="margin:.2rem 0">Turn '+b.turn+'</h2></div><button class="btn" id="forfeit">FORFEIT</button></div><div class="battle" style="margin-top:12px">'+fighter(d,false) + fighter(a,true)+'</div><div class="log">'+b.log.slice(-10).map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>'+(b.over?'<div class="notice '+(b.my.some(x=>x.hp>0)?'win':'lose')+'">'+(b.my.some(x=>x.hp>0)?'Victory!':'Defeat.')+' <button class="btn primary" id="again">REMATCH</button></div>':'<div class="moves4" style="margin-top:12px">'+a.moves.map((m,i)=>'<button class="movebtn" data-act="'+i+'" '+(m.pp<=0?'disabled':'')+'><strong>'+cap(m.name.replace(/-/g,' '))+'</strong><div class="muted">'+m.type+' • '+(m.power||'—')+' POW • '+m.pp+' PP</div></button>').join('')+'</div><div class="bench">'+b.my.map((x,i)=>'<button data-switch="'+i+'" '+(x.hp<=0||i===b.mi?'disabled':'')+'>'+x.p.sprite+' '+cap(x.p.name)+'</button>').join('')+'</div>')+'</section>'}
function fighter(m,mine){const pct=Math.max(0,m.hp/m.max*100);return '<div class="fighter"><div style="display:flex;justify-content:space-between"><strong>'+cap(m.p.name)+'</strong><span>Lv.50</span></div><img src="'+m.p.sprite+'"><div class="hp"><i style="width:'+pct+'%"></i></div><div class="muted">'+m.hp+'/'+m.max+' HP • '+m.p.types.join('/')+'</div></div>'}
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='homeBtn'||b.id==='goHome')nav('home');else if(b.id==='teamBtn'||b.id==='goTeam')nav('team');else if(b.id==='battleBtn')state.battle?nav('battle'):beginBattle();else if(b.id==='quick'){if(state.team.length<6)state.team=[1,4,7,25,59,94];beginBattle()}else if(b.id==='toBattle')beginBattle();else if(b.dataset.pick){state.selected=+b.dataset.pick;render()}else if(b.dataset.remove){state.team=state.team.filter(x=>x!==+b.dataset.remove);render()}else if(b.id==='add'){if(state.selected&&!state.team.includes(state.selected)&&state.team.length<6)state.team.push(state.selected);render()}else if(b.dataset.act)await act(+b.dataset.act);else if(b.dataset.switch){const i=+b.dataset.switch;if(state.battle&&state.battle.my[i].hp>0){state.battle.mi=i;state.battle.log.push('Go, '+cap(state.battle.my[i].p.name)+'!');render()}}else if(b.id==='forfeit'){state.battle.over=true;state.battle.log.push('You forfeited.');render()}else if(b.id==='again')beginBattle()});app.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;render()}});app.addEventListener('change',e=>{if(e.target.id==='type'){state.type=e.target.value;render()}if(e.target.id==='sort'){state.sort=e.target.value;render()}});
boot();
</script></body></html>
