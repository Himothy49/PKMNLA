<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanto PvP — Clean V13</title>
<style>
:root{--bg:#071019;--panel:#0e1824;--card:#132233;--line:#26384d;--text:#f4f7fb;--muted:#91a4bb;--gold:#ffd34d;--blue:#63b3ff;--good:#55db8a;--bad:#ff6b6b;--purple:#b58cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#203653,#071019 52%);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:14px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.brand{font-weight:950;letter-spacing:.12em;color:var(--gold)}.spacer{flex:1}.btn{min-height:42px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:850;cursor:pointer}.btn:hover{border-color:var(--gold)}.btn:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--gold);border-color:var(--gold);color:#111}.danger{border-color:#713737}.hero,.panel{background:linear-gradient(180deg,#101c2a,#0b141f);border:1px solid var(--line);border-radius:20px;padding:20px}.hero{padding:32px}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.95;margin:12px 0}.hero h1 span{color:var(--blue)}.muted{color:var(--muted)}.notice{background:#172537;border:1px solid var(--line);padding:11px;border-radius:11px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.dex{min-height:170px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:9px;text-align:left;cursor:pointer}.dex.selected{border-color:var(--gold);outline:2px solid #ffd34d33}.dex img{width:78px;height:78px;display:block;margin:auto}.num{font-size:11px;color:#64748b}.tag{font-size:10px;color:var(--gold);font-weight:900}.controls{display:grid;grid-template-columns:1.5fr .7fr .7fr;gap:9px;margin:12px 0}.input,.select{width:100%;min-height:42px;background:#09121c;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px}.team{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.slot{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px}.slot img{width:34px;height:34px}.detail{display:grid;grid-template-columns:250px 1fr;gap:14px;margin-top:14px}.portrait{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px}.portrait img{width:190px;height:190px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{background:#09121c;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center}.stat b{display:block;font-size:19px}.moves{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.move{background:#09121c;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}.move.selected{border-color:var(--gold);background:#1a2737}.battlegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fighter{background:linear-gradient(180deg,#142235,#0b141e);border:1px solid var(--line);border-radius:17px;padding:15px}.fighter img{width:180px;height:180px;display:block;margin:auto;image-rendering:auto}.hp{height:12px;background:#263244;border-radius:99px;overflow:hidden}.hp i{height:100%;display:block;background:var(--good)}.hp.low i{background:var(--bad)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.movebtn{text-align:left;min-height:72px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px;color:var(--text);cursor:pointer}.movebtn:hover{border-color:var(--gold)}.bench{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.log{background:#080e15;border:1px solid var(--line);border-radius:12px;padding:11px;max-height:230px;overflow:auto;margin-top:12px}.log div{padding:3px 0;color:#cbd5e1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.room{font-size:2rem;letter-spacing:.16em;font-weight:950}.result{font-size:1.4rem;font-weight:950}.win{color:var(--good)}.lose{color:var(--bad)}.pill{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:99px;font-size:11px;color:var(--muted);margin:2px}.online{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:12px}.check{color:var(--good);font-weight:900}@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}.detail{grid-template-columns:1fr}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.controls,.online,.actions,.moves,.battlegrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:22px}.fighter img,.portrait img{width:140px;height:140px}}
</style></head>

<script src="https://unpkg.com/@pkmn/dex@0.10.11"></script>

</body></html>
